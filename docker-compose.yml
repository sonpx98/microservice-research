services:
  mongo:
    image: mongo:6.0
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    env_file: apps/api/.env
    environment:
      MONGO_URI: mongodb://user:password@mongo:27017/pikaflow?authSource=admin
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
