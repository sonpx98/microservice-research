name: practice-hub

on:
  push:
    branches: [master, develop]
    paths: ['apps/practice-hub/**', '.github/workflows/practice-hub.yml']
  pull_request:
    paths: ['apps/practice-hub/**', '.github/workflows/practice-hub.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 22.5+ required for node:sqlite
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter practice-hub typecheck
      - run: pnpm --filter practice-hub test # 38 unit + integration (Vitest)
      - run: pnpm --filter practice-hub build

  e2e:
    runs-on: ubuntu-latest
    needs: test # only run the slow suite once the fast one is green
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter practice-hub exec playwright install --with-deps chromium
      - run: pnpm --filter practice-hub test:e2e # 4 Playwright specs (auth, chat, WebRTC call)
